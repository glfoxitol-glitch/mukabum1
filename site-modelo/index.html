<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carregando…</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cor: #0f766e;
      --cor-escura: #115e59;
      --fundo: #ffffff;
      --fundo-alt: #f4f7f6;
      --texto: #1c2321;
      --texto-suave: #5b6663;
      --borda: #e2e8e6;
      --whatsapp: #25d366;
      --raio: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --fundo: #111614;
        --fundo-alt: #182020;
        --texto: #eef3f1;
        --texto-suave: #a3b0ac;
        --borda: #2a3432;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--fundo);
      color: var(--texto);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; }
    .container { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 16px; }

    /* Cabeçalho */
    header {
      position: sticky; top: 0; z-index: 50;
      background: color-mix(in srgb, var(--fundo) 88%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--borda);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
    .marca { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; text-decoration: none; }
    .marca img { height: 36px; width: auto; }
    .marca .inicial {
      width: 36px; height: 36px; border-radius: 10px; background: var(--cor); color: #fff;
      display: grid; place-items: center; font-weight: 800;
    }
    .menu { display: flex; gap: 28px; list-style: none; }
    .menu a { text-decoration: none; color: var(--texto-suave); font-weight: 500; font-size: .95rem; }
    .menu a:hover { color: var(--texto); }

    .botao {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 22px; border-radius: 999px; font-weight: 600; font-size: .98rem;
      text-decoration: none; border: 0; cursor: pointer; transition: transform .15s, background .15s;
    }
    .botao:hover { transform: translateY(-1px); }
    .botao-whats { background: var(--whatsapp); color: #06301a; }
    .botao-whats:hover { background: #1fbe5b; }
    .botao-sec { background: transparent; color: var(--texto); border: 1.5px solid var(--borda); }
    .botao svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav .botao { padding: 10px 18px; font-size: .9rem; }

    /* Hero */
    .hero { padding: 88px 0 72px; background: linear-gradient(180deg, var(--fundo-alt), var(--fundo)); }
    .hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; }
    .selo {
      display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: .82rem; font-weight: 600;
      background: color-mix(in srgb, var(--cor) 12%, transparent); color: var(--cor); margin-bottom: 18px;
    }
    h1 { font-size: clamp(2rem, 4.6vw, 3.2rem); line-height: 1.12; letter-spacing: -.02em; font-weight: 800; margin-bottom: 18px; }
    .hero p { font-size: 1.12rem; color: var(--texto-suave); margin-bottom: 30px; max-width: 540px; }
    .acoes { display: flex; flex-wrap: wrap; gap: 12px; }
    .hero-img {
      aspect-ratio: 4 / 3.4; border-radius: 22px; overflow: hidden;
      background: linear-gradient(135deg, var(--cor), var(--cor-escura));
      display: grid; place-items: center; color: #fff; font-size: 4rem; font-weight: 800;
      box-shadow: 0 24px 60px -24px color-mix(in srgb, var(--cor) 55%, transparent);
    }
    .hero-img img { width: 100%; height: 100%; object-fit: cover; }

    /* Seções */
    section { padding: 80px 0; }
    .alt { background: var(--fundo-alt); }
    .titulo-secao { text-align: center; max-width: 640px; margin: 0 auto 48px; }
    .titulo-secao h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); letter-spacing: -.015em; line-height: 1.2; margin-bottom: 12px; }
    .titulo-secao p { color: var(--texto-suave); font-size: 1.05rem; }

    .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .cartao {
      background: var(--fundo); border: 1px solid var(--borda); border-radius: var(--raio); padding: 28px;
    }
    .alt .cartao { background: var(--fundo); }
    .icone {
      width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 1.4rem;
      background: color-mix(in srgb, var(--cor) 12%, transparent); margin-bottom: 16px;
    }
    .cartao h3 { font-size: 1.12rem; margin-bottom: 8px; }
    .cartao p { color: var(--texto-suave); font-size: .97rem; }
    .cartao .preco { color: var(--cor); font-weight: 700; margin-top: 14px; }

    .sobre { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
    .sobre h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); line-height: 1.2; margin-bottom: 16px; }
    .sobre p { color: var(--texto-suave); margin-bottom: 14px; }
    .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 26px; }
    .numeros strong { display: block; font-size: 1.8rem; color: var(--cor); font-weight: 800; line-height: 1.1; }
    .numeros span { font-size: .88rem; color: var(--texto-suave); }

    .depoimento p { font-style: italic; color: var(--texto); }
    .depoimento .autor { margin-top: 16px; font-weight: 600; font-style: normal; font-size: .93rem; }
    .estrelas { color: #f5b301; margin-bottom: 10px; letter-spacing: 2px; }

    .faq { max-width: 760px; margin: 0 auto; }
    details { border: 1px solid var(--borda); border-radius: var(--raio); padding: 18px 22px; margin-bottom: 12px; background: var(--fundo); }
    summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; color: var(--cor); font-size: 1.3rem; line-height: 1; }
    details[open] summary::after { content: "−"; }
    details p { margin-top: 12px; color: var(--texto-suave); }

    .cta {
      background: linear-gradient(135deg, var(--cor), var(--cor-escura)); color: #fff;
      border-radius: 24px; padding: 56px 32px; text-align: center;
    }
    .cta h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); margin-bottom: 12px; line-height: 1.2; }
    .cta p { opacity: .9; margin-bottom: 28px; font-size: 1.05rem; }

    footer { border-top: 1px solid var(--borda); padding: 40px 0; color: var(--texto-suave); font-size: .92rem; }
    .rodape { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; }
    .rodape a { text-decoration: none; }
    .rodape a:hover { color: var(--texto); }
    .redes { display: flex; gap: 16px; }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    /* Responsivo */
    @media (max-width: 900px) {
      .hero-grid, .sobre { grid-template-columns: 1fr; gap: 36px; }
      .grade { grid-template-columns: 1fr 1fr; }
      .menu { display: none; }
    }
    @media (max-width: 600px) {
      .grade { grid-template-columns: 1fr; }
      .hero { padding: 56px 0 48px; }
      section { padding: 56px 0; }
      .nav .botao span { display: none; }
      .nav .botao { padding: 10px; }
      .acoes .botao { width: 100%; }
      .cta { padding: 40px 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="marca" href="#inicio" id="marca"></a>
    <ul class="menu">
      <li><a href="#servicos">Serviços</a></li>
      <li><a href="#sobre">Sobre</a></li>
      <li><a href="#depoimentos">Depoimentos</a></li>
      <li><a href="#duvidas">Dúvidas</a></li>
    </ul>
    <a class="botao botao-whats" data-whats="cabecalho" href="#">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.5L3 29l6.7-1.7c1.9 1 4.1 1.6 6.3 1.6 7.2 0 13-5.8 13-13S23.2 3 16 3zm0 23.7c-2 0-3.9-.5-5.6-1.5l-.4-.2-4 1 1-3.9-.3-.4C5.7 20 5.2 18 5.2 16 5.2 10 10 5.2 16 5.2S26.8 10 26.8 16 22 26.7 16 26.7zm5.9-8.1c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.7 5 .8.4 1.4.6 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
      <span>Fale conosco</span>
    </a>
  </div>
</header>

<main id="inicio">
  <div class="hero">
    <div class="container hero-grid">
      <div>
        <span class="selo" id="hero-selo"></span>
        <h1 id="hero-titulo"></h1>
        <p id="hero-texto"></p>
        <div class="acoes">
          <a class="botao botao-whats" data-whats="hero" href="#">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.5L3 29l6.7-1.7c1.9 1 4.1 1.6 6.3 1.6 7.2 0 13-5.8 13-13S23.2 3 16 3zm5.9 15.6c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.7 5 .8.4 1.4.6 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
            <span id="hero-botao"></span>
          </a>
          <a class="botao botao-sec" href="#servicos">Ver serviços</a>
        </div>
      </div>
      <div class="hero-img" id="hero-img"></div>
    </div>
  </div>

  <section id="servicos">
    <div class="container">
      <div class="titulo-secao">
        <h2 id="servicos-titulo"></h2>
        <p id="servicos-texto"></p>
      </div>
      <div class="grade" id="servicos-lista"></div>
    </div>
  </section>

  <section id="sobre" class="alt">
    <div class="container sobre">
      <div class="hero-img" id="sobre-img"></div>
      <div>
        <h2 id="sobre-titulo"></h2>
        <div id="sobre-texto"></div>
        <div class="numeros" id="sobre-numeros"></div>
      </div>
    </div>
  </section>

  <section id="depoimentos">
    <div class="container">
      <div class="titulo-secao"><h2>O que dizem nossos clientes</h2></div>
      <div class="grade" id="depoimentos-lista"></div>
    </div>
  </section>

  <section id="duvidas" class="alt">
    <div class="container">
      <div class="titulo-secao"><h2>Dúvidas frequentes</h2></div>
      <div class="faq" id="faq-lista"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <div class="cta">
        <h2 id="cta-titulo"></h2>
        <p id="cta-texto"></p>
        <a class="botao botao-whats" data-whats="cta" href="#">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.5L3 29l6.7-1.7c1.9 1 4.1 1.6 6.3 1.6 7.2 0 13-5.8 13-13S23.2 3 16 3zm5.9 15.6c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.7 5 .8.4 1.4.6 1.9.7.8.3 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
          Chamar no WhatsApp
        </a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="container rodape">
    <div>
      <strong id="rodape-nome"></strong><br>
      <span id="rodape-endereco"></span><br>
      <span id="rodape-horario"></span>
    </div>
    <div class="redes" id="rodape-redes"></div>
    <div>© <span id="ano"></span> <span id="rodape-copy"></span></div>
  </div>
</footer>

<!-- Os dados de cada cliente ficam todos em config.js -->
<script src="config.js"></script>
<script src="chat.js" defer></script>
<script>
  (function () {
    var c = window.SITE;
    if (!c) { document.body.innerHTML = "<p style='padding:24px'>Arquivo config.js não encontrado.</p>"; return; }

    var $ = function (id) { return document.getElementById(id); };
    var texto = function (id, valor) { var el = $(id); if (el) el.textContent = valor || ""; };
    var esc = function (s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    };

    // Cores e textos básicos
    var raiz = document.documentElement.style;
    if (c.cor) raiz.setProperty("--cor", c.cor);
    if (c.corEscura) raiz.setProperty("--cor-escura", c.corEscura);
    document.title = c.nome + (c.slogan ? " | " + c.slogan : "");
    document.querySelector('meta[name="description"]').setAttribute("content", c.descricao || "");

    // Link do WhatsApp: cai direto no número conectado ao CRM
    var numero = String(c.whatsapp.numero || "").replace(/\D/g, "");
    function linkWhats(origem) {
      var msg = (c.whatsapp.mensagens && c.whatsapp.mensagens[origem]) || c.whatsapp.mensagem || "";
      return "https://wa.me/" + numero + (msg ? "?text=" + encodeURIComponent(msg) : "");
    }
    document.querySelectorAll("[data-whats]").forEach(function (a) {
      a.href = linkWhats(a.getAttribute("data-whats"));
      a.target = "_blank";
      a.rel = "noopener";
    });

    // Marca
    $("marca").innerHTML = c.logo
      ? '<img src="' + esc(c.logo) + '" alt="' + esc(c.nome) + '">'
      : '<span class="inicial">' + esc(c.nome.charAt(0)) + "</span><span>" + esc(c.nome) + "</span>";

    // Imagens (ou um bloco com a cor da marca, se não houver)
    function imagem(id, src, alt) {
      $(id).innerHTML = src ? '<img src="' + esc(src) + '" alt="' + esc(alt) + '">' : esc(c.nome.charAt(0));
    }

    // Hero
    texto("hero-selo", c.hero.selo);
    texto("hero-titulo", c.hero.titulo);
    texto("hero-texto", c.hero.texto);
    texto("hero-botao", c.hero.botao || "Chamar no WhatsApp");
    imagem("hero-img", c.hero.imagem, c.nome);

    // Serviços
    texto("servicos-titulo", c.servicos.titulo);
    texto("servicos-texto", c.servicos.texto);
    $("servicos-lista").innerHTML = c.servicos.itens.map(function (s) {
      return '<div class="cartao"><div class="icone">' + esc(s.icone) + "</div><h3>" + esc(s.nome) +
        "</h3><p>" + esc(s.descricao) + "</p>" + (s.preco ? '<div class="preco">' + esc(s.preco) + "</div>" : "") + "</div>";
    }).join("");

    // Sobre
    texto("sobre-titulo", c.sobre.titulo);
    $("sobre-texto").innerHTML = c.sobre.paragrafos.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
    $("sobre-numeros").innerHTML = (c.sobre.numeros || []).map(function (n) {
      return "<div><strong>" + esc(n.valor) + "</strong><span>" + esc(n.rotulo) + "</span></div>";
    }).join("");
    imagem("sobre-img", c.sobre.imagem, c.nome);

    // Depoimentos
    var dep = c.depoimentos || [];
    if (!dep.length) $("depoimentos").style.display = "none";
    $("depoimentos-lista").innerHTML = dep.map(function (d) {
      return '<div class="cartao depoimento"><div class="estrelas">★★★★★</div><p>“' + esc(d.texto) +
        '”</p><div class="autor">' + esc(d.autor) + "</div></div>";
    }).join("");

    // FAQ
    var faq = c.faq || [];
    if (!faq.length) $("duvidas").style.display = "none";
    $("faq-lista").innerHTML = faq.map(function (f) {
      return "<details><summary>" + esc(f.pergunta) + "</summary><p>" + esc(f.resposta) + "</p></details>";
    }).join("");

    // Chamada final
    texto("cta-titulo", c.cta.titulo);
    texto("cta-texto", c.cta.texto);

    // Rodapé
    texto("rodape-nome", c.nome);
    texto("rodape-endereco", c.contato.endereco);
    texto("rodape-horario", c.contato.horario);
    texto("rodape-copy", c.nome + ". Todos os direitos reservados.");
    texto("ano", new Date().getFullYear());
    $("rodape-redes").innerHTML = Object.keys(c.redes || {}).filter(function (k) { return c.redes[k]; }).map(function (k) {
      return '<a href="' + esc(c.redes[k]) + '" target="_blank" rel="noopener">' + esc(k.charAt(0).toUpperCase() + k.slice(1)) + "</a>";
    }).join("");

  })();
</script>
</body>
</html>
